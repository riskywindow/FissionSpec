name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s experiments -p 'test_*.py' -v
      - run: ruff check src tests experiments tools
      - run: ruff format --check src tests experiments tools
      - run: mypy src/fissionspec experiments tools
      - run: cargo test --manifest-path crates/fissionspec-core/Cargo.toml
      - run: cargo clippy --manifest-path crates/fissionspec-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path crates/fissionspec-core/Cargo.toml --check
